name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查（编译全部模块）
        run: python -m compileall -q src run.py tools

      - name: 离线自检（不需要网络与 API Key）
        run: python tools/selftest_offline.py

      - name: 前端一致性检查
        run: python tools/check_frontend.py

      - name: 文档链接与引用检查
        run: python tools/check_docs.py

      - name: 应用可正常导入
        run: python -c "import src.app; print('routes:', len(src.app.app.routes))"
